function setNight(on) { night = on; truckLamps().front.emissiveIntensity = truckLamps().rear.emissiveIntensity = on ? 1 : 0; document.getElementById('night').classList.toggle('on', on); hemi.intensity = on ? 0.18 : 1.2; sun.intensity = on ? 0.12 : 2.3; scene.background = new THREE.Color(on ? 0x0b1020 : 0x9fc9ee); if (hlIM) hlIM.visible = on; }
let fps = 0, fr = 0, ft = performance.now();
const T = { tr: 0, rn: 0, n: 0 };   // натрупано време: трафик, рисуване (CPU, ms)
function stats() { const i = R.info; if (bench) return; document.getElementById('st').textContent = `${P.fam} · ${P.size} · ${P.stats.build} парцела + ${P.stats.big} големи · ${P.roads.length} пътя · ${P.rounds.length} кръгови\nплан: ${P.stats.ms} ms · ${tr ? (tr.stats().cars ?? '?') : cars.length} коли\nкадър: ${fps} fps · ${i.render.calls} draw calls · ${(i.render.triangles / 1000).toFixed(0)}k триъгълника · ${i.memory.geometries} геометрии · ${i.memory.textures} текстури\nтрафик ${(T.tr / Math.max(1, T.n)).toFixed(2)} ms · рисуване ${(T.rn / Math.max(1, T.n)).toFixed(2)} ms на кадър (CPU)`; T.tr = T.rn = T.n = 0; }
const fam = document.getElementById('fam'), size = document.getElementById('size'), seed = document.getElementById('seed');
document.getElementById('go').onclick = build; fam.onchange = build; size.onchange = build;
for (const b of ['top', 'game', 'round']) document.getElementById(b).onclick = () => view(b);
document.getElementById('night').onclick = () => setNight(!night);
// 📊 профил: 4-те мегаполиса × 2 камери (общ изглед, близък квартал), по 3 s; трафикът и рисуването — отделно
let bench = null;
const CAMS = { общ: P2 => [P2.center.x + P2.R * 0.9, P2.R * 1.1, P2.center.z + P2.R * 1.2], близо: P2 => [P2.center.x + 70, 60, P2.center.z + 90] };
function benchStart() { bench = { jobs: ['eu', 'us', 'coast', 'radial'].flatMap(f => Object.keys(CAMS).map(c => [f, c])), rows: [], cur: null }; benchNext(); }
function benchNext() {
  const j = bench.jobs.shift(); if (!j) { const r = bench.rows; bench = null; document.getElementById('st').textContent = 'Профил (мегаполис, seed ' + seed.value + '):\n' + r.map(x => `${x[0].padEnd(6)} ${x[1].padEnd(5)} ${String(x[2]).padStart(3)} fps · ${x[3]} calls · ${x[4]}k △ · трафик ${x[5]} ms · рис. ${x[6]} ms`).join('\n'); window.__bench = r; return; }
  if (fam.value !== j[0] || size.value !== 'xl') { fam.value = j[0]; size.value = 'xl'; build(); }
  const p = CAMS[j[1]](P); cam.position.set(...p); ctl.target.set(P.center.x, 0, P.center.z); ctl.update(); lodUpdate(true);
  bench.cur = { j, t0: performance.now() + 1500, n: 0, tr: 0, rn: 0 }; T.tr = T.rn = T.n = 0;
  document.getElementById('st').textContent = `профил: ${j[0]} · ${j[1]}…`;
}
function benchTick(now) {
  const c = bench.cur; if (!c) return; if (now < c.t0) { T.tr = T.rn = T.n = 0; return; }
  c.n++; if (now - c.t0 < 3000) return;
  const i = R.info; bench.rows.push([c.j[0], c.j[1], Math.round(c.n / 3), i.render.calls, Math.round(i.render.triangles / 1000), (T.tr / T.n).toFixed(2), (T.rn / T.n).toFixed(2)]); benchNext();
}
document.getElementById('bench').onclick = benchStart;
// 🧠 памет: 16 превключвания между градовете (всички семейства и размери) и обратно; броим геометриите, текстурите и паметта на JS
document.getElementById('mem').onclick = async () => {
  const snap = () => ({ g: R.info.memory.geometries, t: R.info.memory.textures, js: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null });
  const f0 = fam.value, s0 = size.value, a = snap(), out = [];
  for (let k = 0; k < 16; k++) { fam.value = ['eu', 'us', 'coast', 'radial'][k % 4]; size.value = ['s', 'm', 'l', 'xl'][(k >> 2) % 4]; build(); await new Promise(r => setTimeout(r, 300)); out.push(snap()); }
  fam.value = f0; size.value = s0; build(); await new Promise(r => setTimeout(r, 1200)); const b = snap();
  document.getElementById('st').textContent = `Памет — преди: ${a.g} геометрии, ${a.t} текстури${a.js != null ? ', JS ' + a.js + ' MB' : ''}\nслед 16 смени и връщане: ${b.g} геометрии, ${b.t} текстури${b.js != null ? ', JS ' + b.js + ' MB' : ''}\nнай-много по пътя: ${Math.max(...out.map(x => x.g))} геометрии`;
  window.__mem = { a, b, out };
};
scene.background = new THREE.Color(0x9fc9ee); build();
let last = performance.now();
R.setAnimationLoop(() => { const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t0 = performance.now(); moveCars(dt); const t1 = performance.now(); ctl.update(); lodUpdate(); R.render(scene, cam); const t2 = performance.now();
  T.tr += t1 - t0; T.rn += t2 - t1; T.n++; fr++; if (bench) benchTick(now); if (now - ft > 1000) { fps = fr; fr = 0; ft = now; stats(); } });
window.__p2 = { camTop: (x, z, h = 70) => { ctl.target.set(x, 0, z); cam.position.set(x, h, z + 0.01); ctl.update(); lodUpdate(true); }, camAt: (x, z, d = 40) => { ctl.target.set(x, 0, z); cam.position.set(x + d * 0.55, d * 0.85, z + d * 0.75); ctl.update(); lodUpdate(true); }, P: () => P, view, setNight, cars: () => cars, tr: () => tr && tr.stats(), bench: benchStart, lod: () => ({ near: Object.values(lodIM).reduce((a, ims) => a + (ims[0]?.count || 0), 0), far: lodBox?.count }) };
</script></body></html>
