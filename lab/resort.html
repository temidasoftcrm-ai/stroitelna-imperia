<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Курортите — модели</title>
<style>
  :root { --bg:#14161b; --card:#1d2027; --txt:#e8e8ea; --mut:#9aa0aa; --ok:#5fc27a; --kid:#f5b942; --new:#6aa8ff; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 system-ui,sans-serif; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; } .lead { color:var(--mut); margin:0 0 14px; max-width:900px; }
  h2 { font-size:16px; margin:20px 0 6px; } h3 { font-size:14px; margin:14px 0 6px; color:var(--new); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .wide { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; }
  .it { background:var(--card); border-radius:10px; padding:6px; border:1px solid #2a2f38; display:block; } .it img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:#eef0f4; display:block; }
  .wide .it img { aspect-ratio:auto; } .it.have { border-color:#2f5a3a; } .it.now { border-color:#6a5420; }
  .n { font-weight:600; margin-top:4px; font-size:12px; } .st { font-size:12px; color:var(--mut); }
  ul { margin:0; padding-left:18px; } li { margin:3px 0; } a { color:inherit; text-decoration:none; }
</style></head><body>
<h1>🏔️ Курортите — истински модели вместо детските</h1>
<p class="lead">Детските модели в зимните курорти (сглобяемите хижи от Kenney) и на площадите (пейката, фенерът) — кандидатите от Sketchfab (CC BY, клик — отваря се в Sketchfab). Кажи кои да свалим — после ги виждаш в Лабораторията на мястото им и трием детските.</p>
<div id="out"></div>
<script type="module">
const D = await (await fetch('resort.json')).json(), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cats = [...new Set(D.cand.map(c => c.cat))];
document.getElementById('out').innerHTML =
  (D.have.length ? `<h2>✅ Вече истински (${D.have.length})</h2><div class="grid">` : '<div>') + D.have.map(i => `<a class="it have" href="/lab.html#tab=models&item=${encodeURIComponent('/' + i.f)}" target="_top"><img loading="lazy" src="resort/${i.img}" alt=""><div class="n">${esc(i.n)}</div></a>`).join('') + '</div>' +
  (D.now.length ? `<h2>🟨 Още детски</h2><div class="wide">` : '<div>') + D.now.map(i => `<div class="it now"><img loading="lazy" src="resort/${i.img}" alt=""><div class="n">${esc(i.n)}</div></div>`).join('') + '</div>' +
  `<h2>♻️ Вече са истински / остават</h2><ul>` + D.reuse.map(r => `<li><b>${esc(r.n)}</b> — ${esc(r.how)}</li>`).join('') + '</ul>' +
  `<h2>🔵 Кандидати за сваляне</h2>` + cats.map(k => { const L = D.cand.filter(c => c.cat === k);
    return `<h3>${esc(L[0].title)}</h3><div class="grid">` + L.map((c, i) => `<a class="it" href="${esc(c.url)}" target="_blank" rel="noopener"><img loading="lazy" src="resort/${c.img}" alt=""><div class="n">${k}-${i + 1}. ${esc(c.name)}</div><div class="st">${esc(c.user)} · ${(c.tri / 1000).toFixed(1)} хил. △</div></a>`).join('') + '</div>'; }).join('');
</script></body></html>
