<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../">
<title>Услуги в Рим</title>
<style>
  :root { --bg:#14161b; --card:#1d2027ee; --txt:#e8e8ea; --mut:#9aa0aa; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:13px/1.4 system-ui,sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; } .lbs div { position:fixed; transform:translate(-50%,-100%); padding:2px 7px; border-radius:999px; background:#000b; font:700 11px system-ui; white-space:nowrap; pointer-events:none; }
  .ui { position:fixed; left:12px; top:12px; background:var(--card); border-radius:10px; padding:10px 12px; width:min(380px, calc(100vw - 24px)); max-height:calc(100vh - 24px); overflow:auto; }
  .ui h1 { font-size:15px; margin:0 0 6px; } .row { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  button, select { background:#2a2f38; color:var(--txt); border:1px solid #3a414d; border-radius:7px; padding:5px 9px; font:inherit; cursor:pointer; } button.on { background:#2a6b3e; border-color:#2a6b3e; }
  .m { color:var(--mut); } table { border-collapse:collapse; width:100%; } td { padding:2px 4px; border-bottom:1px solid #2a2f38; }
</style></head><body>
<canvas id="c"></canvas><div class="lbs" id="lbs"></div>
<div class="ui"><h1>🏛️ Обществените услуги — Рим (план v2)</h1>
  <div class="row"><select id="tier"><option value="1">квартали ниво 1</option><option value="2">до ниво 2</option><option value="3">до ниво 3</option><option value="5" selected>всички</option></select>
    <button id="top">⬆ Отгоре</button><button id="game" class="on">🎮 Отблизо</button><button id="next">➡ Следваща сграда</button><button id="order">🧾 Поръчка от общината (+1)</button><button id="night">🌙</button></div>
  <div id="st" class="m">зарежда…</div><table id="tb"></table></div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { plan2Load } from './cityplan2.js';
import { OSM2 } from './cityplan2-osm.js';
import { gamePlan2 } from './cityplan2game.js';
import { buildPlan2View } from './cityplan2-3d.js';
import { SERVICES, seedBase, needs, builds, cityServices, popOf, TIER_NM } from './services.js';
import { servicePlacer, servicesLayer } from './servicesplace.js';

const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 1.75)); R.setSize(innerWidth, innerHeight); R.outputColorSpace = THREE.SRGBColorSpace; R.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb7cde0); const hemi = new THREE.HemisphereLight(0xffffff, 0x666655, 1.1), sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(-300, 500, 200); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -500, right: 500, top: 500, bottom: -500, far: 1500 }); scene.add(hemi, sun);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 6000), ctl = new OrbitControls(cam, R.domElement); ctl.enableDamping = true;
const data = await fetch('assets/plans/rome.json').then(r => r.json()), P = plan2Load(data, OSM2.rome); P.osmData = OSM2.rome;
let VIEW = null, layer = null, gp = null, rec = null, sp = null, focus = 0, night = false; const st = document.getElementById('st'), tb = document.getElementById('tb'), lbs = document.getElementById('lbs');
async function build() {
  if (VIEW) { scene.remove(VIEW); VIEW.userData.dispose && VIEW.userData.dispose(); } if (layer) { scene.remove(layer.group); layer.dispose(); }
  const tier = +document.getElementById('tier').value; gp = gamePlan2(P, { tier }); sp = servicePlacer(gp);
  rec = rec || seedBase({}, 'x', 1); const t0 = performance.now(); const placed = sp.assign(rec); const ms = performance.now() - t0;
  const used = new Set(); for (const list of Object.values(rec)) for (const b of list) for (const id of b.lots || []) used.add(gp.lots[id].p2);
  VIEW = buildPlan2View(P, { osm: OSM2.rome, offset: gp.offset, fillLot: L => !used.has(L.id) }); scene.add(VIEW);
  layer = await servicesLayer(gp, rec, { outline: true }); scene.add(layer.group); layer.setNight(night);
  const pop = popOf(3, true, 120, tier, 5), list = cityServices(rec, pop, 'x'), nd = needs(rec, pop, 'x'), noLot = Object.values(rec).flat().filter(b => !b.lots || !b.lots.length).length;
  st.textContent = `Рим · ${TIER_NM.x} · ~${(pop / 1e6).toFixed(1)} млн. жители · ${gp.lots.length} парцела · ${layer.items.length} сгради на ${[...used].length} парцела · разполагане ${ms.toFixed(0)} ms${noLot ? ` · ⚠️ без място: ${noLot}` : ''} · поръчки: ${nd.length}`;
  tb.innerHTML = '<tr><td></td><td class="m">има</td><td class="m">покритие</td><td class="m">кв.</td></tr>' + list.map(s => { const D = new Set(layer.items.filter(it => it.k === s.k).map(it => it.district)); return `<tr><td>${s.ico} ${s.nm}</td><td>${s.built}</td><td>${Math.round(s.cover * 100)}%</td><td class="m">${[...D].slice(0, 3).join(', ')}${D.size > 3 ? '…' : ''}</td></tr>`; }).join('');
  view(document.getElementById('top').classList.contains('on') ? 'top' : 'game');
}
function view(m) { document.getElementById('top').classList.toggle('on', m === 'top'); document.getElementById('game').classList.toggle('on', m === 'game');
  if (m === 'top') { const sq = gp.square; ctl.target.set(sq.x, 0, sq.z); cam.position.set(sq.x, 1700, sq.z + 10); } else { const it = layer.items[focus % layer.items.length]; if (!it) return; ctl.target.set(it.x, 4, it.z); cam.position.set(it.x + Math.sin(it.rot) * 70 + 30, 55, it.z + Math.cos(it.rot) * 70); } ctl.update(); }
document.getElementById('top').onclick = () => view('top'); document.getElementById('game').onclick = () => view('game');
document.getElementById('next').onclick = () => { focus++; view('game'); };
document.getElementById('tier').onchange = () => { rec = null; build(); };
document.getElementById('night').onclick = e => { night = !night; e.target.classList.toggle('on', night); VIEW.userData.setNight && VIEW.userData.setNight(night); layer.setNight(night); scene.background.set(night ? 0x0b1220 : 0xb7cde0); hemi.intensity = night ? 0.25 : 1.1; sun.intensity = night ? 0.1 : 2; };
document.getElementById('order').onclick = () => { const tier = +document.getElementById('tier').value, pop = popOf(3, true, 120, tier, 5), n = needs(rec, pop, 'x')[0]; if (!n) return; builds(rec, n.k, n.lvl, 1); build().then(() => { focus = layer.items.findIndex(it => it.k === n.k && it.i === rec[n.k].length - 1); view('game'); }); };
const v = new THREE.Vector3();
(function loop() { requestAnimationFrame(loop); ctl.update(); VIEW && VIEW.userData.update && VIEW.userData.update(1 / 60, { camera: cam });
  if (layer) { lbs.innerHTML = ''; const near = cam.position.y < 400; if (near) for (const it of layer.items) { v.set(it.x, 18, it.z).project(cam); if (v.z > 1 || Math.abs(v.x) > 1 || Math.abs(v.y) > 1) continue; const d = document.createElement('div'); d.textContent = `${SERVICES[it.k].ico} ${SERVICES[it.k].nm} · ${it.lvl}`; d.style.left = `${(v.x + 1) / 2 * innerWidth}px`; d.style.top = `${(1 - v.y) / 2 * innerHeight}px`; lbs.appendChild(d); } }
  R.render(scene, cam); })();
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
window.__svc = { get rec() { return rec; }, get gp() { return gp; }, get layer() { return layer; } };
build();
</script></body></html>
