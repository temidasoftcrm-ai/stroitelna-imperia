<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f141c">
<link rel="apple-touch-icon" href="assets/ui/icon-180.png">
<title>Онлайн империя</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌐%3C/text%3E%3C/svg%3E">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg:#0f141c; --panel:rgba(16,21,30,.94); --line:rgba(255,255,255,.12); --acc:#ffb300; --acc2:#ff8f00; --ok:#4cd07d; --bad:#ff6b6b; --txt:#eef1f6; --mut:#9aa3b5; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .hidden { display:none !important; }
  .btn2 { border:1px solid var(--line); background:rgba(255,255,255,.06); border-radius:9px; padding:6px 11px; font-weight:700; }
  .btn2:hover { background:rgba(255,255,255,.14); }
  .btn { border:0; border-radius:10px; padding:9px 16px; font-weight:800; color:#1a1200; background:linear-gradient(180deg,#ffd54a,#ffb300); }
  .btn:disabled, .btn2:disabled { background:#ffffff1c; color:#ffffff60; cursor:default; }
  input, select { width:100%; padding:11px; border-radius:9px; border:1px solid var(--line); background:#0f141c; font-size:16px; }
  .card { background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .card h3 { font-size:15px; display:flex; align-items:center; gap:8px; }
  .meta { color:var(--mut); font-size:13px; line-height:1.45; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .bar { height:8px; background:rgba(255,255,255,.1); border-radius:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--acc2),var(--acc)); }
  .ok { color:var(--ok); } .bad { color:var(--bad); }

  /* заставка и екраните преди играта */
  #bg { position:fixed; inset:-30px; background:url(assets/ui/splash.webp) center/cover; filter:blur(14px) brightness(.45); }
  #screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto; }
  .sheet { position:relative; background:#18202cf2; border:1px solid var(--line); border-radius:18px; padding:22px; width:100%; max-width:560px; display:flex; flex-direction:column; gap:12px; box-shadow:0 20px 60px #0008; }
  .sheet h1 { font-size:24px; color:var(--acc); letter-spacing:.03em; }
  .sheet h2 { font-size:18px; }
  .brands { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; }
  .brand { border:2px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; background:rgba(255,255,255,.04); }
  .brand b { display:block; font-size:14px; margin-top:4px; }
  .brand span { font-size:26px; }
  .brand.on { border-color:var(--bc); box-shadow:0 0 0 1px var(--bc) inset, 0 0 18px -4px var(--bc); }
  .err { color:var(--bad); font-size:13px; min-height:1em; }

  /* играта */
  #game { position:fixed; inset:0; }
  #top { position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:14px; padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line); z-index:5; }
  #top .logo { font-weight:900; letter-spacing:.04em; white-space:nowrap; }
  #top .stat { font-size:15px; white-space:nowrap; } #top .stat b { font-size:17px; }
  #top .sp { flex:1; }
  #conn { font-size:15px; font-weight:800; letter-spacing:.04em; padding:6px 14px; border-radius:9px; border:1px solid #4cd07d66; background:#4cd07d22; color:#9ff0bd; white-space:nowrap; }
  #conn.retry { background:#ffb30026; color:#ffd77a; border-color:#ffb30066; } #conn.offline { background:#ff6b6b26; color:#ffb3b3; border-color:#ff6b6b66; }
  #view { position:fixed; top:52px; left:0; right:360px; bottom:0; }
  #view .ph { position:absolute; inset:0; background:url(assets/ui/splash.webp) center/cover; opacity:.35; }
  #view canvas { display:block; }
  #view .ld { position:absolute; left:50%; bottom:24px; transform:translateX(-50%); width:min(320px,70%); text-align:center; font-size:13px; color:var(--mut); }
  .offer .need span { font-size:12px; padding:2px 7px; border-radius:8px; background:rgba(255,255,255,.08); margin:4px 4px 0 0; display:inline-block; }
  .offer .need span.miss { background:rgba(255,107,107,.18); color:#ffb3b3; }
  .unit { display:flex; align-items:center; gap:10px; }
  .unit img { width:54px; height:40px; object-fit:cover; border-radius:8px; }
  #panel { position:fixed; top:52px; right:0; bottom:0; width:360px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; z-index:4; }
  #tabs { display:flex; border-bottom:1px solid var(--line); }
  #tabs button { flex:1; border:0; background:transparent; padding:12px 2px; font-size:12.5px; font-weight:700; color:var(--mut); border-bottom:3px solid transparent; }
  #tabs button.on { color:var(--txt); border-bottom-color:var(--acc); }
  #tabs .badge { display:inline-block; min-width:18px; padding:0 5px; border-radius:9px; background:var(--acc); color:#1a1200; font-size:11px; margin-left:3px; }
  #body { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stats div { background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
  .stats b { display:block; font-size:19px; color:var(--acc); } .stats span { font-size:12px; color:var(--mut); }
  .led { font-size:13px; display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-bottom:1px solid #ffffff0d; }
  #toasts { position:fixed; left:14px; bottom:14px; display:flex; flex-direction:column-reverse; gap:8px; z-index:30; max-width:min(420px, calc(100vw - 28px)); }
  .toast { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--acc); border-radius:10px; padding:10px 12px; font-size:14px; }
  .toast.good { border-left-color:var(--ok); } .toast.bad { border-left-color:var(--bad); }
  @media (max-width: 760px) {
    #view { right:0; bottom:45vh; }
    #panel { top:auto; height:45vh; width:100%; border-left:0; border-top:1px solid var(--line); }
    #top { gap:8px; padding:0 8px; } #top .logo { display:none; }
    #conn { font-size:13px; padding:4px 9px; }
  }
</style>
</head>
<body>
<div id="bg"></div>
<div id="screen"></div>
<div id="game" class="hidden">
  <div id="top">
    <a href="./" class="btn2" title="Към самостоятелната игра" style="text-decoration:none;color:var(--txt)">←</a>
    <span class="logo" id="coName"></span>
    <span class="stat">💶 <b id="cash">—</b></span>
    <span class="stat">📅 <b id="day">—</b></span>
    <span id="conn" title="Онлайн режим: времето е общо за всички и не се ускорява">● Online</span>
    <span class="sp"></span>
  </div>
  <div id="view"><div class="ph" id="ph"></div><div class="ld" id="ld">Зареждане на града… <div class="bar"><i id="ldBar" style="width:3%"></i></div></div></div>
  <div id="panel"><div id="tabs"></div><div id="body"></div></div>
</div>
<div id="toasts"></div>
<script type="module" src="online.js"></script>
</body>
</html>
